services:
  postgres:
    image: postgres:16-alpine
    container_name: remote-admin-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-remote_admin}
      POSTGRES_USER: ${POSTGRES_USER:-remote_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password_change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-remote_admin} -d ${POSTGRES_DB:-remote_admin}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
