services:
  postgres:
    image: postgres:16-alpine
    container_name: remote-admin-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-remote_admin}
      POSTGRES_USER: ${POSTGRES_USER:-remote_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password_change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-remote_admin} -d ${POSTGRES_DB:-remote_admin}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  api:
    build:
      context: .
      dockerfile: src/RemoteAdmin.Api/Dockerfile
    container_name: remote-admin-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-remote_admin};Username=${POSTGRES_USER:-remote_admin};Password=${POSTGRES_PASSWORD:-dev_password_change_me}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: remote-admin-ui
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
